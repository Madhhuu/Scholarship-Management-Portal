```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ScholarHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f4f7fb;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px #142b4a15;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-brand h1 {
            color: #142b4a;
            margin-bottom: 8px;
        }

        .login-brand p,
        .login-subtitle {
            color: #64748b;
            line-height: 1.6;
        }

        .login-card label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .login-card input,
        .login-card select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        .login-card input:focus,
        .login-card select:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-card button:hover {
            background: #1e40af;
        }

        .login-message {
            margin-top: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .login-back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #1d4ed8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <div class="login-brand">
                <h1>🎓 ScholarHub</h1>
                <p>Scholarship Management Portal</p>
            </div>

            <h2>Welcome Back!</h2>
            <p class="login-subtitle">
                Sign in to access your dashboard.
            </p>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <label for="role">Login As</label>
                <select id="role" required>
                    <option value="student">Student</option>
                    <option value="admin">Admin</option>
                    <option value="verifier">Institute Verifier</option>
                    <option value="officer">Sanctioning Officer</option>
                </select>

                <button type="submit">Login</button>
                <p id="loginMessage" class="login-message"></p>
            </form>

            <a class="login-back" href="index.html">
                Back to Student Dashboard
            </a>
        </section>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener(
            "submit",
            function (event) {
                event.preventDefault();

                const role = document.getElementById("role").value;
                const message = document.getElementById("loginMessage");

                message.style.color = "#b45309";
                message.textContent =
                    "Login page demonstration only. Authentication is not connected yet.";
            }
        );
    </script>
</body>
</html>
